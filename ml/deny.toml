# cargo-deny untuk workspace pelatihan (terpisah dari deny.toml utama).
# Tanpa target iOS: biner ini hanya untuk mesin latih (macOS/Linux).
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Aturan keras 1: tanpa OCCT/ITK/VTK/OpenCV; tanpa libtorch (bukan Rust murni).
deny = [
    { crate = "opencascade" },
    { crate = "opencv" },
    { crate = "vtk-rs" },
    { crate = "tch" },
    { crate = "torch-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
