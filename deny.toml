# Konfigurasi cargo-deny (aturan 14 bagian 14 histo3d.md). Disalin dari DUCAD
# dengan pengecualian OCCT dibuang: HISTO3D tidak memakai OCCT.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # `encoding` 0.2.33 tidak dipelihara (bukan kerentanan). Masuk hanya lewat
    # wsi-rs 0.6 → dicom-object/dicom-parser → dicom-encoding 0.9.1 untuk
    # mendekode teks DICOM; tidak ada versi dicom-rs tanpa crate ini dan
    # wsi-rs tidak punya fitur untuk mematikan DICOM. Tinjau ulang saat
    # wsi-rs/dicom-rs dinaikkan (pengecualian hulu wsi-rs sendiri berakhir
    # 2026-10-01, lihat SUPPLY_CHAIN.md mereka).
    { id = "RUSTSEC-2021-0153", reason = "transitif lewat wsi-rs → dicom-encoding; tidak dipelihara, bukan kerentanan" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    # Ubuntu Font Licence 1.0: font Ubuntu-Light yang dibundel
    # `epaint_default_fonts` (font bawaan egui; hanya crate GUI). Mengizinkan
    # penyematan dan redistribusi font tanpa modifikasi.
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Aturan keras 1 dan 11: tanpa OCCT/ITK/VTK/OpenCV dan tanpa HTTP.
deny = [
    { crate = "opencascade" },
    { crate = "opencascade-sys" },
    { crate = "occt-sys" },
    { crate = "opencv" },
    { crate = "vtk-rs" },
    { crate = "openslide-rs" },
    { crate = "ureq" },
    { crate = "reqwest" },
    { crate = "hyper" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
